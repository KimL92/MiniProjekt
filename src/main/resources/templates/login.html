<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<div class="container">
    <h1>Welcome to 1 ummahs wishlist</h1>
    <h2>Login</h2>

    <!-- Error message -->
    <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login/validate-login}" method="post">

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text"
                   name="username"
                   id="username"
                   placeholder="Username"
                   required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password"
                   name="password"
                   id="password"
                   placeholder="Password"
                   required>
        </div>

        <button type="submit" class="btn-submit">Login</button>
    </form>

    <!-- LINK TIL CREATE USER (ikke en form) -->
    <p>
        <a th:href="@{/login/create-user}" class="btn-submit">Create user</a>
        <!-- Alternativt relativt link fra /login-siden: <a th:href="@{create-user}"> -->
    </p>
</div>
</body>
</html>
