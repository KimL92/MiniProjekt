<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/registeruser.css}" rel="stylesheet">
    <title>Create user</title>
</head>
<body>
<div class="container">
    <h1>Welcome to 1 ummahs wishlist</h1>
    <h2>Create a user to go forward</h2>

    <!-- Error message vises her -->
    <div th:if="${error}" class="error-message">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/registerpage}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="userName">Username:</label>
            <input type="text" id="userName" th:field="*{userName}" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label for="userPassword">Password:</label>
            <input type="password" id="userPassword" th:field="*{userPassword}" required>
        </div>

        <button type="submit" class="btn-submit">Create user</button>
    </form>
</div>
</body>
</html>
