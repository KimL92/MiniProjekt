<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8">
    <title>Ønskeskyen</title>
    <link th:href="@{/wishlist.css}" rel="stylesheet">
</head>
<body>
<h1>Ønskelister</h1>

<table>
    <tr th:if="${wishlists == null or #lists.isEmpty(wishlists)}">
        <td colspan="3">Der er ikke nogen ønskeliste</td>
    </tr>

    <tr th:if="${wishlists != null and !#lists.isEmpty(wishlists)}">
        <th>Name</th>
        <th>Description</th>
        <th>Action</th>
    </tr>

    <tr th:each="wishlist : ${wishlists}">
        <td th:text="${wishlist.wishlistName}"></td>
        <td th:text="${wishlist.wishlistDescription}"></td>
        <td>
            <a th:href="@{/wishitem/list/{id}(id=${wishlist.wishlistID})}">Se liste</a>
            <form th:action="@{/wishlist/delete/{id}(id=${wishlist.wishlistID})}" method="post" style="display:inline">
            <button type="submit">Slet</button>
            </form>
        </td>
    </tr>
</table>

<a th:href="@{/wishlist/createwishlist}"><button>Opret ny ønskeliste</button></a>

</body>
</html>
